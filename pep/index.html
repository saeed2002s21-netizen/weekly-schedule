<style>
/* Layout: single phone column, floating ink tab bar; neo-brutal cards (ink outline + hard offset shadow). */
:root{
  --bg:#F6F4FB; --card:#FFFFFF; --fg:#16131F; --muted:#5B5470; --faint:#9A93AE;
  --line:#16131F; --shadow:#16131F; --soft:#EFEBF8; --divider:#E7E2F2;
  --ink:#16131F; --nav:#16131F; --navfg:#FFFFFF;
  --orange:#FF7A3D; --sun:#FFD23F; --lilac:#B79CFF; --mint:#3DDC97;
  --peach:#FFE4D6; --mintsoft:#DDF6EA; --sunsoft:#FFF3C4; --lilacsoft:#EAE2FF;
  --up:#0E7A4F; --down:#B4441A;
  --display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body:'DM Sans', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13101B; --card:#1F1A2A; --fg:#F4F1FA; --muted:#B4ACC8; --faint:#7D7591;
  --line:#4C4560; --shadow:#000000; --soft:#2B2538; --divider:#302A3E;
  --nav:#2A2438; --navfg:#FFFFFF; --up:#5BE3A6; --down:#FF9B73; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13101B; --card:#1F1A2A; --fg:#F4F1FA; --muted:#B4ACC8; --faint:#7D7591;
  --line:#4C4560; --shadow:#000000; --soft:#2B2538; --divider:#302A3E;
  --nav:#2A2438; --navfg:#FFFFFF; --up:#5BE3A6; --down:#FF9B73; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
html.stage,html.stage body{background:#16131F}
body{color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 130px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.disp{font-family:var(--display)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800}
.muted{color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-size:42px;line-height:1;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:3px 3px 0 var(--shadow)}
.on-color{color:var(--ink)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}
.chip{width:44px;height:44px;flex-shrink:0;border-radius:13px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.03em;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;background:var(--card)}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.btn{height:58px;border-radius:20px;border:2px solid var(--ink);background:var(--orange);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .12s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ink{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--fg);font-size:16px;height:54px}
.btn.plain{background:var(--card);color:var(--fg);border-color:var(--line);box-shadow:none;font-family:var(--body);font-size:16px;font-weight:700}
.rbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:transform .12s}
.rbtn.plus{background:var(--orange);border-color:var(--ink);color:var(--ink)}
.rbtn:active{transform:scale(.88)}
.numin{width:52px;height:44px;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin::placeholder{color:var(--faint)}
.field{height:52px;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:0 16px;font-size:17px;font-weight:600;width:100%}
textarea.field{height:88px;padding:12px 14px;resize:none;font-size:15px;font-weight:500}
.seg{display:grid;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px}
.seg button{height:42px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
.choice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.choice button{height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:24px}
.choice button[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.pills button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{padding:2px 16px}
.list>*+*{border-top:2px dashed var(--divider)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:52px;text-decoration:none;color:inherit;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>.lrow:first-child{border-top:0}
.rounds{display:grid;gap:10px}
.round{background:var(--bg);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.cell{width:100%;height:44px;border:2px solid var(--divider);border-radius:12px;background:var(--bg);text-align:center;font-family:var(--display);font-weight:800;font-size:18px;padding:0}
.cell::placeholder{color:var(--faint)}
.check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.check[aria-pressed="true"]{background:var(--mint);border-color:var(--ink);color:var(--ink)}
.setrow{border-radius:14px}
.setrow.done{background:var(--mintsoft)}
.status{border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.st-up{background:var(--mint)}.st-same{background:var(--soft);color:var(--fg);border-color:var(--line)}.st-down{background:var(--card);color:var(--fg);border-style:dashed;border-color:var(--line)}.st-new{background:var(--lilac)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));pointer-events:none;z-index:20}
.nav-in{pointer-events:auto;max-width:448px;margin:0 auto;height:70px;background:var(--nav);border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:0 8px 24px rgba(22,19,31,.25)}
.nav button{height:48px;min-width:48px;border:0;border-radius:16px;background:transparent;color:var(--navfg);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:700;font-size:14px}
.nav button[aria-current="page"]{background:var(--orange);color:var(--ink);padding:0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top, 0px));z-index:40;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;max-width:calc(100% - 32px);box-shadow:3px 3px 0 var(--orange)}
.sheet-bg{position:fixed;inset:0;background:rgba(22,19,31,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--bg);border-top:2px solid var(--line);border-radius:28px 28px 0 0;padding:12px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px;max-height:92%;overflow:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:18px;border-radius:3px;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
.skel{height:120px;border-radius:20px;background:var(--soft)}
svg.chart text{font-family:var(--body);font-size:11px;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
html{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top, 0px)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>

<div id="app" class="app" aria-live="polite">
  <div class="row" style="gap:10px">
    <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#16131F"/><rect x="13" y="11" width="9" height="28" rx="4.5" fill="#FFFFFF"/><circle cx="27" cy="20" r="9" fill="#FF7A3D"/><circle cx="38" cy="9.5" r="3" fill="#FFD23F"/></svg>
    <span class="disp" style="font-size:26px;font-weight:800">pep</span>

</div>
<div id="nav" class="nav" hidden></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
var C = {orange:'#FF7A3D', sun:'#FFD23F', lilac:'#B79CFF', mint:'#3DDC97', peach:'#FFE4D6'};
var CATS = {
  cal:{name:'Calisthenics', tag:'CAL', place:'home', color:C.orange, sub:'Push-ups, plank, pull, squat, glutes, abs'},
  legs:{name:'Legs', tag:'LEG', place:'gym', color:C.lilac, sub:'Quads, hamstrings, glutes, calves'},
  chest:{name:'Chest', tag:'CHS', place:'gym', color:C.lilac, sub:'Presses and flys'},
  back:{name:'Back', tag:'BCK', place:'gym', color:C.lilac, sub:'Pulldowns and rows'},
  shoulders:{name:'Shoulders', tag:'SHD', place:'gym', color:C.lilac, sub:'Presses and raises'},
  arms:{name:'Arms', tag:'ARM', place:'gym', color:C.lilac, sub:'Biceps and triceps'},
  cardio:{name:'Cardio', tag:'CRD', place:'cardio', color:C.mint, sub:'Walk and jog, in minutes'}
};
var GYM = ['legs','chest','back','shoulders','arms'];
function L(id,name,cat,mode,tag,sets,reps){return {id:id,name:name,cat:cat,mode:mode,tag:tag,sets:sets||3,reps:reps||10};}
var LIB = [
  L('pushup_knee','Push-up (Knee)','cal','reps','PSH',2),
  L('pushup_full','Push-up (Full)','cal','reps','PSF',2),
  L('plank','Plank','cal','time','PLK',2),
  L('pull','Pull','cal','reps','PUL',2),
  L('squat','Squat','cal','reps','SQT',2),
  L('gluteal','Gluteal','cal','reps','GLU',2),
  L('abs','Abs','cal','reps','ABS',2),
  L('back_squat','Back Squat','legs','weight','BSQ'),
  L('leg_press','Leg Press','legs','weight','LPR'),
  L('rdl','Romanian Deadlift','legs','weight','RDL'),
  L('leg_ext','Leg Extension','legs','weight','LEX',3,12),
  L('leg_curl','Leg Curl','legs','weight','LCU',3,12),
  L('calf_raise','Calf Raise','legs','weight','CLF',3,15),
  L('bench','Bench Press','chest','weight','BEN'),
  L('incline_db','Incline Dumbbell Press','chest','weight','IDP'),
  L('chest_fly','Chest Fly (Machine)','chest','weight','FLY',3,12),
  L('cable_cross','Cable Crossover','chest','weight','CBL',3,12),
  L('lat_pulldown','Lat Pulldown','back','weight','LAT'),
  L('seated_row','Seated Cable Row','back','weight','ROW'),
  L('bb_row','Barbell Row','back','weight','BBR'),
  L('assist_pullup','Assisted Pull-up','back','weight','APU',3,8),
  L('back_ext','Back Extension','back','reps','BEX',3,12),
  L('ohp','Overhead Press','shoulders','weight','OHP'),
  L('lat_raise','Lateral Raise','shoulders','weight','LRA',3,12),
  L('rear_delt','Rear Delt Fly','shoulders','weight','RDF',3,12),
  L('face_pull','Face Pull','shoulders','weight','FPL',3,12),
  L('bicep_curl','Biceps Curl','arms','weight','BIC'),
  L('hammer_curl','Hammer Curl','arms','weight','HAM'),
  L('tri_push','Triceps Pushdown','arms','weight','TRI',3,12),
  L('oh_tri','Overhead Triceps Extension','arms','weight','OTE',3,12)
];
var UNIT = {reps:'reps', time:'sec', weight:'kg'};

/* ---------- state ---------- */
var S = {db:null, dbState:'loading', profile:undefined, sessions:[], weights:[], custom:[], loaded:{},
  view:'home', cat:null, back:'home', draft:null, savedId:null, celebrate:false, statEx:null,
  openDay:null, sheet:null, ob:{name:'', goal:3}, wDraft:null, wDate:null, rmArm:null, toastMsg:null, settings:null};

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function today(){return iso(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function weekStart(s){var d=parse(s);d.setDate(d.getDate()-d.getDay());return iso(d);}
function fmt(s,opts){return parse(s).toLocaleDateString('en-US',opts||{weekday:'short',month:'short',day:'numeric'});}
function fmtShort(s){return parse(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function r1(n){return Math.round(n*10)/10;}
function sgn(n){return (n>0?'+':n<0?'−':'')+Math.abs(r1(n)).toFixed(1);}
function nm(){return (S.profile&&S.profile.name)||'friend';}
function goalW(){return (S.profile&&S.profile.goalWeight)||65;}
function weekly(){return (S.profile&&S.profile.weeklyGoal)||3;}
function exById(id){for(var i=0;i<LIB.length;i++)if(LIB[i].id===id)return LIB[i];for(var j=0;j<S.custom.length;j++)if(S.custom[j].id===id)return S.custom[j];return {id:id,name:id,cat:'cal',mode:'reps',tag:id.slice(0,3).toUpperCase(),sets:3,reps:10};}
function exForCat(cat){return LIB.filter(function(e){return e.cat===cat;}).concat(S.custom.filter(function(e){return e.cat===cat;}));}
function catColor(cat){return cat==='cal'?C.peach:(CATS[cat]||{}).color||C.lilac;}
function sortedSessions(){return S.sessions.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((a.createdAt||'')<(b.createdAt||'')?1:-1);});}
function itemBest(it){
  if(it.vals){var m=null;it.vals.forEach(function(v){if(v!=null&&v!==''&&(m==null||v>m))m=Number(v);});return m;}
  if(it.sets){var e=exById(it.ex);var best=null;it.sets.forEach(function(s){var v=e.mode==='weight'?Number(s.kg):Number(s.reps);if(!isNaN(v)&&(s.kg!=null||s.reps!=null)&&(best==null||v>best))best=v;});return best;}
  return null;}
function itemText(it){
  var e=exById(it.ex);
  if(it.vals)return it.vals.map(function(v){return v==null||v===''?'–':v;}).join(' · ')+(e.mode==='time'?'s':'');
  if(it.sets)return it.sets.map(function(s){return e.mode==='weight'?((s.kg==null?'–':s.kg)+'×'+(s.reps==null?'–':s.reps)):(s.reps==null?'–':s.reps)+(e.mode==='time'?'s':'');}).join(', ');
  return '';}
function before(sess,ref){return sess.date<ref.date||(sess.date===ref.date&&(sess.createdAt||'')<(ref.createdAt||''));}
function lastItem(exId,ref){var list=sortedSessions();for(var i=0;i<list.length;i++){var s=list[i];if(ref&&(s.id===ref.id||!before(s,ref)))continue;var it=(s.items||[]).find(function(x){return x.ex===exId;});if(it&&itemBest(it)!=null)return {item:it,session:s};}return null;}
function bestBefore(exId,ref){var m=null;S.sessions.forEach(function(s){if(ref&&(s.id===ref.id||!before(s,ref)))return;(s.items||[]).forEach(function(it){if(it.ex===exId){var b=itemBest(it);if(b!=null&&(m==null||b>m))m=b;}});});return m;}
function sessionDates(){var o={};S.sessions.forEach(function(s){if((s.items&&s.items.length)||(s.cardio&&(s.cardio.walk||s.cardio.jog)))o[s.date]=1;});return Object.keys(o).sort();}
function weekCount(ws){return sessionDates().filter(function(d){return weekStart(d)===ws;}).length;}
function weightsSorted(){return S.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});}
function avgRange(from,to){var xs=S.weights.filter(function(w){return w.date>=from&&w.date<=to;});if(!xs.length)return null;return xs.reduce(function(a,w){return a+Number(w.kg);},0)/xs.length;}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

/* ---------- icons ---------- */
var I = {
  home:'<path d="M3 11l9-7 9 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>',
  dumb:'<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
  scale:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 9.5a5 5 0 0 1 8 0M12 9.5l1.5-2"/>',
  stats:'<path d="M5 20V12M12 20V5M19 20v-9"/>',
  hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  back:'<path d="M15 6l-6 6 6 6"/>', next:'<path d="M9 6l6 6-6 6"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  down:'<path d="M6 9l6 6 6-6"/>', trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'

  var th=getTheme();
  return backbar('Settings','pep')+
  '<section class="card col" style="padding:18px;gap:18px"><div class="col" style="gap:8px"><label for="set-name" style="font-weight:700">Your name</label><input id="set-name" class="field" data-in="set-name" value="'+esc(st.name)+'"></div>'+
  '<fieldset style="border:0;margin:0;padding:0" class="col"><legend style="font-weight:700;margin-bottom:8px;padding:0">Sessions per week</legend><div class="choice">'+[2,3,4,5].map(function(n){return '<button type="button" data-a="set-goal" data-v="'+n+'" aria-pressed="'+(st.goal===n)+'">'+n+'</button>';}).join('')+'</div></fieldset>'+
  '<div class="col" style="gap:8px"><label for="set-gw" style="font-weight:700">Goal weight (kg)</label><input id="set-gw" class="field" type="number" inputmode="decimal" step="0.5" data-in="set-gw" value="'+st.gw+'"></div>'+
  '<button class="btn" data-a="save-settings">Save changes</button></section>'+
  '<section class="card col" style="padding:18px;gap:10px"><span style="font-weight:700">Appearance</span><div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[['system','Auto'],['light','Light'],['dark','Dark']].map(function(t){return '<button data-a="theme" data-v="'+t[0]+'" aria-pressed="'+(th===t[0])+'">'+t[1]+'</button>';}).join('')+'</div></section>'+
  '<section class="card col" style="padding:18px;gap:12px"><span style="font-weight:700">Backup</span><p class="muted" style="font-size:14px;margin:0">Your log is saved on this phone only. Make a backup now and then, and use it to move your log to a new phone.</p>'+
  '<button class="btn plain" data-a="export">Save a backup file</button><label class="btn plain filebtn">Restore from a backup<input type="file" accept="application/json,.json" data-in="import" aria-label="Choose a pep backup file"></label></section>';};

function sheetAdd(){
  var a=S.sheet;
  return '<div class="sheet-bg" data-a="add-ex-close"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ae-title" data-stop="1"><span aria-hidden="true" style="align-self:center;width:44px;height:5px;border-radius:3px;background:var(--divider)"></span>'+
  '<div class="row" style="justify-content:space-between"><h2 id="ae-title" style="font-size:26px">New exercise</h2><button class="iconbtn" data-a="add-ex-close" aria-label="Close">'+ic('x',18,3)+'</button></div>'+
  '<div class="col" style="gap:8px"><label for="ae-name" style="font-weight:700">Name</label><input id="ae-name" class="field disp" data-in="ae-name" value="'+esc(a.name)+'" placeholder="e.g. Cable Crossover" style="font-weight:700;font-size:18px"></div>'+
  '<fieldset style="border:0;margin:0;padding:0"><legend style="font-weight:700;margin-bottom:8px;padding:0">Add to</legend><div class="pills">'+Object.keys(CATS).filter(function(c){return c!=='cardio';}).map(function(c){return '<button type="button" data-a="ae-cat" data-v="'+c+'" aria-pressed="'+(a.cat===c)+'">'+CATS[c].name+'</button>';}).join('')+'</div></fieldset>'+
  '<fieldset style="border:0;margin:0;padding:0"><legend style="font-weight:700;margin-bottom:8px;padding:0">How do you track it?</legend><div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[['weight','Weight × reps'],['reps','Reps only'],['time','Time']].map(function(m){return '<button type="button" data-a="ae-mode" data-v="'+m[0]+'" aria-pressed="'+(a.mode===m[0])+'">'+m[1]+'</button>';}).join('')+'</div></fieldset>'+
  (a.cat!=='cal'?'<div class="row" style="justify-content:space-between"><span style="font-weight:700">Default sets</span><span class="row" style="gap:8px"><button class="rbtn" data-a="ae-sets" data-d="-1" aria-label="Fewer sets">'+ic('minus',16,3.5)+'</button><span class="num" style="width:30px;text-align:center;font-size:26px">'+a.sets+'</span><button class="rbtn plus" data-a="ae-sets" data-d="1" aria-label="More sets">'+ic('plus',16,3.5)+'</button></span></div>':'')+
  '<button class="btn" data-a="ae-save">Add exercise</button></section></div>';}

/* ---------- render ---------- */
var app=document.getElementById('app'), navEl=document.getElementById('nav'), ov=document.getElementById('overlay');
var TABS={home:1,workouts:1,weight:1,stats:1,history:1,category:1};
function render(){
  if(S.dbState==='none'){app.innerHTML='<div class="row" style="gap:8px">'+logo(38)+'<span class="disp" style="font-size:26px;font-weight:800">pep</span></div><h1>Open pep in Claude</h1><p class="muted" style="font-size:16px">Your log is stored in your Claude account. Open this page from Claude while signed in to see and save your workouts.</p>';navEl.hidden=true;return;}
  if(S.dbState==='loading'||S.profile===undefined)return;
  if(S.profile===null&&S.view!=='welcome')S.view='welcome';
  var v=V[S.view]||V.home;
  document.documentElement.classList.toggle('stage',S.view==='saved');
  app.innerHTML=v();
  navEl.hidden=!TABS[S.view];
  if(!navEl.hidden)navEl.innerHTML=navBar();
  var o='';
  if(S.sheet)o+=sheetAdd();
  if(S.toastMsg)o+='<div class="toast" role="status">'+esc(S.toastMsg)+'</div>';
  if(S.celebrate){var cols=[C.orange,C.sun,C.lilac,C.mint,'#FFFFFF'];o+='<div class="confetti" aria-hidden="true">';for(var i=0;i<46;i++){o+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%5]+';animation-delay:'+(Math.random()*0.5).toFixed(2)+'s;transform:rotate('+Math.round(Math.random()*180)+'deg)"></i>';}o+='</div>';S.celebrate=false;setTimeout(function(){var c=ov.querySelector('.confetti');if(c)c.remove();},2600);}
  ov.innerHTML=o;
}
var toastT;
function toast(m){S.toastMsg=m;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toastMsg=null;var t=ov.querySelector('.toast');if(t)t.remove();},2600);}
function go(v){S.view=v;S.rmArm=null;if(v==='settings')S.settings=null;window.scrollTo(0,0);render();}

/* ---------- actions ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('sheet-bg')&&ev.target.closest('[data-stop]'))return;
  var a=el.getAttribute('data-a'), v=el.getAttribute('data-v'), d=S.draft;
  var i=+el.getAttribute('data-i'), r=+el.getAttribute('data-r'), sI=+el.getAttribute('data-s'), dd=parseFloat(el.getAttribute('data-d'));
  switch(a){
    case 'go': S.back=S.view; go(v); break;
    case 'back': if(S.view==='session'){go(S.back==='category'?'category':S.back||'home');} else if(S.view==='category'){go('workouts');} else go('home'); break;
    case 'open-cat': if(v==='cardio'){S.back=S.view;S.draft=newDraft('cardio');go('session');} else {S.cat=v;go('category');} break;
    case 'start': S.back=S.view;S.draft=newDraft(v);go('session'); break;
    case 'step': var cur=d.items[i].vals[r];d.items[i].vals[r]=Math.max(0,(cur==null?0:Number(cur))+dd);render(); break;
    case 'cardio': var f=el.getAttribute('data-f');d.cardio[f]=Math.max(0,(d.cardio[f]||0)+dd);render(); break;
    case 'add-round': d.rounds++;d.items.forEach(function(it){it.vals.push(null);});render(); break;
    case 'rm-round': if(d.rounds>1){d.rounds--;d.items.forEach(function(it){it.vals.pop();});}render(); break;
    case 'set-done': var s=d.items[i].sets[sI];s.done=!s.done;if(s.done&&s.reps==null){var e=exById(d.items[i].ex);s.reps=e.reps||10;}render(); break;
    case 'add-set': var sets=d.items[i].sets, lst=sets[sets.length-1];sets.push({kg:lst?lst.kg:null,reps:null,done:false});render(); break;
    case 'save-session': saveSession(); break;
    case 'discard': S.draft=null;go(S.back==='category'?'category':'home'); break;
    case 'w-step': S.wDraft=Math.max(20,r1((S.wDraft||0)+dd));render(); break;
    case 'save-weight': saveWeight(); break;
    case 'stat-ex': S.statEx=v;render(); break;
    case 'day': S.openDay=S.openDay===v?null:v;render(); break;
    case 'ob-goal': S.ob.goal=+v;render(); break;
    case 'ob-save': saveOnboarding(); break;
    case 'set-goal': S.settings.goal=+v;render(); break;
    case 'save-settings': saveSettings(); break;
    case 'theme': setTheme(v);render(); break;
    case 'add-ex-open': S.sheet={name:'',cat:v||'chest',mode:v==='cal'?'reps':'weight',sets:3};render();setTimeout(function(){var n=document.getElementById('ae-name');if(n)n.focus();},50); break;
    case 'add-ex-close': if(ev.target!==el&&el.classList.contains('sheet-bg'))return; S.sheet=null;render(); break;
    case 'ae-cat': S.sheet.cat=v;if(v==='cal'&&S.sheet.mode==='weight')S.sheet.mode='reps';render(); break;
    case 'ae-mode': S.sheet.mode=v;render(); break;
    case 'ae-sets': S.sheet.sets=Math.min(8,Math.max(1,S.sheet.sets+dd));render(); break;
    case 'ae-save': saveExercise(); break;
    case 'rm-ex': if(S.rmArm===v){removeExercise(v);} else {S.rmArm=v;render();} break;
    case 'export': exportData(); break;
  }
});
function num(x){if(x===''||x==null)return null;var n=parseFloat(x);return isNaN(n)?null:n;}
document.addEventListener('change',function(ev){
  var el=ev.target, k=el.getAttribute&&el.getAttribute('data-in');if(!k)return;
  var d=S.draft, i=+el.getAttribute('data-i'), sI=+el.getAttribute('data-s');
  if(k==='val'){d.items[i].vals[+el.getAttribute('data-r')]=num(el.value);render();}
  else if(k==='kg'||k==='reps'){d.items[i].sets[sI][k]=num(el.value);render();}
  else if(k==='cardio'){d.cardio[el.getAttribute('data-f')]=Math.max(0,num(el.value)||0);render();}
  else if(k==='sdate'){if(el.value)d.date=el.value;}
  else if(k==='wval'){var n=num(el.value);if(n!=null)S.wDraft=n;}
  else if(k==='wdate'){if(el.value)S.wDate=el.value;}
  else if(k==='set-gw'){S.settings.gw=num(el.value)||65;}
});
document.addEventListener('input',function(ev){
  var el=ev.target,k=el.getAttribute&&el.getAttribute('data-in');if(!k)return;
  if(k==='notes')S.draft.notes=el.value;
  else if(k==='ob-name')S.ob.name=el.value;
  else if(k==='set-name')S.settings.name=el.value;
  else if(k==='ae-name')S.sheet.name=el.value;
  else if(k==='wval'){var n=num(el.value);if(n!=null)S.wDraft=n;}
});
document.addEventListener('submit',function(e){e.preventDefault();});

/* ---------- writes ---------- */
function fail(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Ask Claude to tidy old entries.':'Could not save. Check your connection and try again.');}
function saveOnboarding(){
  var name=S.ob.name.trim();if(!name){toast('Add your name first.');var n=document.getElementById('ob-name');if(n)n.focus();return;}
  var p={name:name,weeklyGoal:S.ob.goal,goalWeight:65,createdAt:new Date().toISOString()};
  S.db.doc('app/profile').set(p).then(function(){S.profile=p;go('home');},fail);}
function saveSettings(){
  var st=S.settings;var p=Object.assign({},S.profile||{}, {name:(st.name||'').trim()||nm(),weeklyGoal:st.goal,goalWeight:st.gw||65});
  S.db.doc('app/profile').set(p).then(function(){S.profile=p;toast('Settings saved');},fail);}
function saveSession(){
  var d=S.draft, items=[];
  d.items.forEach(function(it){
    if(it.vals){var vals=it.vals.map(function(v){return v==null||v===''?null:Number(v);});if(vals.some(function(v){return v!=null&&v>0;}))items.push({ex:it.ex,vals:vals});}
    else{var sets=it.sets.filter(function(s){return s.done||s.kg!=null||s.reps!=null;}).map(function(s){return {kg:s.kg==null?null:Number(s.kg),reps:s.reps==null?null:Number(s.reps)};});if(sets.length)items.push({ex:it.ex,sets:sets});}
  });
  var cardio={walk:d.cardio.walk||0,jog:d.cardio.jog||0};
  if(!items.length&&!cardio.walk&&!cardio.jog){toast('Add at least one number before saving.');return;}
  var wsBefore=weekCount(weekStart(d.date)), hadDay=sessionDates().indexOf(d.date)>=0;
  var id=d.date+'-'+Date.now().toString(36);
  var doc={date:d.date,cat:d.cat,rounds:d.cat==='cal'?d.rounds:null,items:items,cardio:cardio,notes:(d.notes||'').trim(),createdAt:new Date().toISOString()};
  var probe=Object.assign({id:id},doc);
  var pr=items.some(function(it){var b=bestBefore(it.ex,probe);var c=itemBest(it);return b!=null&&c!=null&&c>b;});
  var goalHit=!hadDay&&wsBefore+1>=weekly()&&wsBefore<weekly();
  S.db.doc('sessions/'+id).set(doc).then(function(){
    if(!S.sessions.some(function(s){return s.id===id;}))S.sessions.push(probe);
    S.savedId=id;S.draft=null;S.celebrate=pr||goalHit;go('saved');},fail);}
function saveWeight(){
  var kg=r1(S.wDraft), date=S.wDate||today();
  if(!(kg>20&&kg<300)){toast('That weight looks off. Check the number.');return;}
  S.db.doc('weights/'+date).set({date:date,kg:kg,createdAt:new Date().toISOString()}).then(function(){toast('Saved '+kg.toFixed(1)+' kg for '+fmtShort(date));},fail);}
function saveExercise(){
  var a=S.sheet, name=(a.name||'').trim();if(!name){toast('Give the exercise a name.');return;}
  var id='c_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30)+'_'+Date.now().toString(36);
  var e={name:name,cat:a.cat,mode:a.mode,sets:a.cat==='cal'?2:a.sets,reps:10,tag:name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'NEW',createdAt:new Date().toISOString()};
  S.db.doc('exercises/'+id).set(e).then(function(){S.sheet=null;S.cat=a.cat;if(S.view!=='category'){S.view='category';}toast(name+' added to '+CATS[a.cat].name);},fail);}
function removeExercise(id){S.db.doc('exercises/'+id).delete().then(function(){S.rmArm=null;toast('Removed');},fail);}

/* ---------- local store (data stays on this device) ---------- */
var KEY='pep-data-v1';
function loadAll(){try{var x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?x:{};}catch(e){return {};}}
var DATA=loadAll(), LISTENERS=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DATA));return true;}catch(e){return false;}}
function snapDoc(path){var p=path.split('/');var d=(DATA[p[0]]||{})[p[1]];return {id:p[1],exists:!!d,data:function(){return d;}};}
function snapCol(c){var col=DATA[c]||{};return {docs:Object.keys(col).map(function(id){var d=col[id];return {id:id,exists:true,data:function(){return d;}};})};}
function notify(){LISTENERS.forEach(function(l){l.fn(l.doc?snapDoc(l.path):snapCol(l.path));});}
var LocalDB={
  doc:function(path){var p=path.split('/');return {
    set:function(v){var prev=(DATA[p[0]]||{})[p[1]];(DATA[p[0]]=DATA[p[0]]||{})[p[1]]=JSON.parse(JSON.stringify(v));if(!persist()){if(prev)DATA[p[0]][p[1]]=prev;else delete DATA[p[0]][p[1]];return Promise.reject({code:'quota_exceeded'});}setTimeout(notify,0);return Promise.resolve();},
    delete:function(){if(DATA[p[0]])delete DATA[p[0]][p[1]];persist();setTimeout(notify,0);return Promise.resolve();},
    onSnapshot:function(fn){LISTENERS.push({doc:true,path:path,fn:fn});setTimeout(function(){fn(snapDoc(path));},0);return function(){};}};},
  collection:function(c){return {onSnapshot:function(fn){LISTENERS.push({doc:false,path:c,fn:fn});setTimeout(function(){fn(snapCol(c));},0);return function(){};}};}
};
function exportData(){
  var out={app:'pep',version:1,exportedAt:new Date().toISOString(),data:DATA};
  var blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download='pep-backup-'+today()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  toast('Backup file created');}
function importData(file){
  var rd=new FileReader();
  rd.onload=function(){try{var x=JSON.parse(rd.result);var d=x&&x.data?x.data:x;
    if(!d||typeof d!=='object'||(!d.sessions&&!d.weights)){toast('That file is not a pep backup.');return;}
    var keepProfile=DATA.app&&DATA.app.profile;
    DATA={sessions:d.sessions||{},weights:d.weights||{},exercises:d.exercises||{},app:d.app||{}};
    if(!DATA.app.profile&&keepProfile)DATA.app.profile=keepProfile;
    if(!persist()){toast('Not enough space on this device to restore.');return;}
    notify();var n=Object.keys(DATA.sessions).length,w=Object.keys(DATA.weights).length;
    toast('Restored '+n+' workouts and '+w+' weigh-ins');}catch(e){toast('Could not read that file.');}};
  rd.readAsText(file);}
document.addEventListener('change',function(ev){var el=ev.target;if(el&&el.getAttribute&&el.getAttribute('data-in')==='import'&&el.files&&el.files[0]){importData(el.files[0]);el.value='';}});

/* ---------- boot ---------- */
function boot(){
  Promise.resolve(LocalDB).then(function(db){
    S.db=db;S.dbState='ok';
    var pending=4;function done(){if(--pending===0)render();else if(pending<0)render();}
    db.doc('app/profile').onSnapshot(function(s){S.profile=s.exists?s.data():null;if(S.profile&&S.view==='welcome')S.view='home';done();},function(){S.dbState='none';render();});
    db.collection('sessions').onSnapshot(function(q){S.sessions=q.docs.map(function(x){return Object.assign({id:x.id},x.data());});done();});
    db.collection('weights').onSnapshot(function(q){S.weights=q.docs.map(function(x){return x.data();}).filter(function(w){return w&&w.date;});done();});
    db.collection('exercises').onSnapshot(function(q){S.custom=q.docs.map(function(x){var e=x.data();return Object.assign({id:x.id,custom:true,sets:3,reps:10},e);});done();});
  }).catch(function(){S.dbState='none';render();});
}
boot();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
