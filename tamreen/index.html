 b("mopen",()=>{S.medit=true;render()}); b("mcancel",()=>{S.medit=false;render()});
 b("msave",()=>{const st=parseInt(String($("mst").value).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,""));const kv=parseFloat(String($("mkm").value).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,"."));if(!st||st<1||st>100000){$("merr").textContent="اكتب عدد خطوات صحيح";return}applySteps(st,isNaN(kv)?null:kv,true)});
 document.querySelectorAll("[data-bk]").forEach(x=>x.onclick=()=>{S.w.bk.dur=+x.dataset.bk*60000;S.w.bk.fin=false;saveRun();render()});
 b("wgo",()=>startWorkout());
 document.querySelectorAll("[data-rep]").forEach(x=>x.onclick=()=>{S.w.val=+x.dataset.rep;$("val").textContent=ar(S.w.val);hlChips()});
 b("wopen",()=>{S.wv=null;go("weight")}); b("wback",()=>{S.tab="home";go("home")});
 const wval=()=>{const v=parseFloat(String($("wv").value).replace(",","."));return isNaN(v)?null:v};
 b("wmn",()=>{const v=wval()??S.wv;S.wv=Math.max(20,v-0.1);$("wv").value=kg(S.wv)});
 b("wpl",()=>{const v=wval()??S.wv;S.wv=Math.min(300,v+0.1);$("wv").value=kg(S.wv)});
 b("wsave",()=>{const v=wval();if(v==null||v<20||v>300){$("werr").textContent="اكتب وزن صحيح بالكيلو، مثل 74.5";return}P.weights[dkey()]=Math.round(v*10)/10;saveProfile();S.wv=null;S.tab="home";go("home")});
 document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{if(S.done){Object.assign(S,fresh())}if(!S.sess0)S.sess0=now();if(x.dataset.go==="cardio")go("cardio");else startWorkout()});
 b("cta",()=>{if(!S.sess0)S.sess0=now();document.querySelector('[data-go="'+(S.c.done?"warm":"cardio")+'"]').click()});
 b("reset",()=>{Object.assign(S,fresh());S.sess0=now();go("cardio")});
 document.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>{const m=x.dataset.act;if(!S.c.first)S.c.first=now();if(S.c.mode)S.c[S.c.mode]+=now()-S.c.t0;S.c.mode=S.c.mode===m?null:m;S.c.t0=now();if(S.c.mode)motionStart(S.c.mode);else motionStop();saveRun();render()});
 b("cdone",()=>{if(S.c.mode){S.c[S.c.mode]+=now()-S.c.t0;S.c.mode=null}S.c.done=true;S.c.end=now();motionStop();S.stW=liveSteps("walk");S.stJ=liveSteps("jog");
  if(S.c.walk+S.c.jog<1000){startWorkout();return}
  S.w.bk={t0:now(),dur:120000,fin:false};snd("rest");if(P.hk){S.hkWait=true;go("brk");setTimeout(()=>runSC(cMin()),350)}else go("brk")});
 b("cback",()=>go("home"));
 b("hget",()=>{S.stW=Math.round(S.c.walk/60000*105+(S.c.walk?40:0));S.stJ=Math.round(S.c.jog/60000*160+(S.c.jog?30:0));S.steps=S.stW+S.stJ;render()});
 b("hskip",()=>go("home")); b("hhome",()=>go("home"));
 b("exit",()=>{if(!S.w.exit){S.w.exit=true;render();setTimeout(()=>{if(S.w.exit){S.w.exit=false;if(inWorkout())render()}},3500);return}S.w.exit=false;if(S.c.mode){S.c[S.c.mode]+=now()-S.c.t0;S.c.mode=null}motionStop();if(!S.c.done&&(S.c.walk+S.c.jog)>0){S.c.done=true;S.stW=liveSteps("walk");S.stJ=liveSteps("jog")}if((S.c.walk+S.c.jog)>0||Object.keys(S.w.reps).length){S.sessEnd=now();recordSession();S.done=true}else{Object.assign(S,fresh())}S.tab="home";go("home")});
 b("gnext",nextGuide);
 b("mn",()=>{S.w.val=Math.max(0,S.w.val-1);$("val").textContent=ar(S.w.val);hlChips()});
 b("pl",()=>{S.w.val++;$("val").textContent=ar(S.w.val);hlChips()});
 b("pkb",()=>{if(S.w.pk){S.w.val=Math.floor((now()-S.w.pk)/1000);S.w.pk=null;snd("done")}else{S.w.pk=now();snd("go")}render()});
 b("sdone",exDone); b("r15",()=>{S.w.dur+=15000;tick()}); b("rgo",restDone);
 b("shome",()=>{S.tab="home";go("home")});
 document.querySelectorAll("[data-dk]").forEach(x=>x.onclick=()=>{S.sday=x.dataset.dk&&S.sday!==x.dataset.dk?x.dataset.dk:null;render()});
 document.querySelectorAll("[data-rng]").forEach(x=>x.onclick=()=>{S.range=x.dataset.rng;S.off=0;S.sday=null;render()});
 document.querySelectorAll("[data-off]").forEach(x=>x.onclick=()=>{S.off=Math.max(0,S.off+(+x.dataset.off));S.sday=null;render()});
 document.querySelectorAll("[data-mon]").forEach(x=>x.onclick=()=>{const t=new Date(),y=t.getFullYear()-S.off;S.range="m";S.off=(t.getFullYear()-y)*12+t.getMonth()-(+x.dataset.mon);if(S.off<0)S.off=0;S.sday=null;render()});
 document.querySelectorAll("[data-mth]").forEach(x=>x.onclick=()=>{S.m[EX[S.w.i].id]=x.dataset.mth;saveProfile();render()});
 document.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{const k=x.dataset.k,v=x.dataset.v;if(k==="theme")S.theme=v;else S[k]=+v;saveProfile();render();if(k==="snd"&&S.snd)snd("go")});
}
function tick(){const tt=$("tot");if(tt)tt.textContent=tm(sessMs());
 if(S.scr==="cardio"){const sn=$("snote");if(sn){const q=sNote();if(sn.dataset.q!==q){sn.dataset.q=q;sn.innerHTML=q}}const t=$("tmain");if(t)t.textContent=tm(el("walk")+el("jog"));["walk","jog"].forEach(m=>{const x=$("t-"+m);if(x)x.textContent=tm(el(m));const y=$("s-"+m);if(y)y.textContent=ar(liveSteps(m))+" خطوة · "+k2(km(liveSteps(m)))+" كم"})}
 if(S.scr==="brk"&&S.w.bk){const bk=S.w.bk,e2=now()-bk.t0,left=bk.dur-e2,c=$("tcirc"),r=$("ring");
  if(c)c.innerHTML=left>0?tm(left):'<span style="font-size:22px">جاهز؟</span>';if(r)r.style.setProperty("--p",Math.min(100,e2/bk.dur*100));
  if(left>0)cdown("brk",left);else if(!bk.fin){bk.fin=true;snd("go");render()}}
 if(S.scr==="warm"||S.scr==="cool"){const L=S.scr==="warm"?WARM:COOL,it=L[S.w.i],el=now()-S.w.t0;
  if(S.w.tr){const left=S.w.dur-el,c=$("tcirc"),r=$("ring");if(left<=0){advGuide();return}
   if(c)c.innerHTML='<span style="font-size:64px">'+Math.ceil(left/1000)+'</span>';if(r){r.style.setProperty("--p",Math.min(100,el/S.w.dur*100));r.classList.add("gap")}cdown("tr"+S.scr+S.w.i,left);return}
  if(el>=S.w.dur){endMove();return}
  const g=gState(it,el),c=$("tcirc"),r=$("ring"),sd=$("side");
  if(c)c.innerHTML=g.gap?'<span style="font-size:22px">بدّل</span>':tm(g.left);
  if(r){r.style.setProperty("--p",Math.min(100,g.frac*100));r.classList.toggle("gap",!!g.gap)}
  if(sd&&it.sides)sd.innerHTML=g.gap?'⇄ بدّل لـ'+g.side:'<span class="sdot'+(g.ph===0?" on":"")+'"></span>'+it.sides[0]+' &nbsp; <span class="sdot'+(g.ph===2?" on":"")+'"></span>'+it.sides[1];
  if(g.ph!==S.w.ph){if(S.w.ph>=0)snd(g.gap?"swap":"go");S.w.ph=g.ph}
  if(!g.gap)cdown(S.scr+S.w.i+"p"+g.ph,g.left)}
 if(S.scr==="rest"){const el=now()-S.w.t0,left=S.w.dur-el,c=$("tcirc"),r=$("ring");if(c)c.textContent=tm(left);if(r)r.style.setProperty("--p",Math.min(100,el/S.w.dur*100));if(left<=0)restDone();else cdown("rest"+S.w.next.i+S.w.next.round,left)}
 if(S.scr==="ex"&&S.w.pk){const p=$("pk");if(p)p.textContent=ar(Math.floor((now()-S.w.pk)/1000))}
}
setInterval(tick,250); setInterval(saveRun,5000);
{const n=(()=>{try{return localStorage.getItem("tamreen.name")}catch(e){return null}})(); if(n)loadProfile(n); else S.scr="name";}
fit(); render();
